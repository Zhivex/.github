name: Feature request
description: Propose a scoped improvement to a Zhivex project
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: input
    id: repository
    attributes:
      label: Repository or package
      placeholder: Zhivex/zhivex-ai-sdk or @zhivex-ai/core
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem rather than only a proposed API.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and provider impact
      description: Note affected runtimes, providers, public APIs, or migrations.

