name: Bug report
description: Report a reproducible problem in a Zhivex project
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Remove credentials, private prompts, and customer data before submitting.
  - type: input
    id: repository
    attributes:
      label: Repository and package
      placeholder: Zhivex/zhivex-ai-sdk, @zhivex-ai/sdk
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.0.1
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest safe code sample or repository that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and operating system
      placeholder: Bun 1.3.7 on Ubuntu 24.04
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, credentials, customer data, and private prompt content.
          required: true
        - label: This is not a security vulnerability.
          required: true

